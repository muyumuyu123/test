<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Starting Soon — Starlight Dreams</title>
  <link rel="stylesheet" href="../assets/theme.css">
  <link rel="stylesheet" href="scene.css">
</head>
<body class="scene">
  <canvas class="fill" id="stars"></canvas>
  <div class="moon" style="top: 90px; right: 170px"></div>
  <div class="clouds" id="clouds"></div>

  <main class="stage">
    <div class="eyebrow" data-cfg-group><i class="sparkle"></i><span data-cfg="name"></span><i class="sparkle"></i></div>
    <h1 class="display shimmer-text headline" data-cfg="startingSoon.heading"></h1>
    <p class="sub" data-cfg="startingSoon.subheading"></p>

    <div class="panel starred countdown">
      <span class="time display" id="time">--:--</span>
    </div>

    <p class="now-title" data-cfg-group><span class="label">today</span><span data-cfg="streamTitle"></span></p>
    <div class="socials" id="socials"></div>
  </main>

  <script src="../config.js"></script>
  <script src="../assets/core.js"></script>
  <script>
    const { cfg, bindText, renderSocials, formatTime, starfield, clouds, onReady } = SD;
    const opts = cfg.startingSoon;

    function targetTime() {
      const at = /^(\d{1,2}):(\d{2})$/.exec(opts.startAt || "");
      if (at) {
        const t = new Date();
        t.setHours(Number(at[1]), Number(at[2]), 0, 0);
        return t.getTime();
      }
      return Date.now() + Number(opts.countdownMinutes || 0) * 60000;
    }

    onReady(() => {
      bindText();
      renderSocials(document.getElementById("socials"));
      starfield(document.getElementById("stars"));
      clouds(document.getElementById("clouds"));

      const end = targetTime();
      const el = document.getElementById("time");
      function tick() {
        const left = (end - Date.now()) / 1000;
        if (left <= 0) {
          el.textContent = opts.doneText;
          el.classList.add("done");
          return;
        }
        el.textContent = formatTime(Math.ceil(left));
        setTimeout(tick, 250);
      }
      tick();
    });
  </script>
</body>
</html>
