<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Game Frame — Starlight Dreams</title>
  <link rel="stylesheet" href="../assets/theme.css">
  <style>
    body {
      width: 1920px;
      height: 1080px;
      position: relative;
    }

    /* Gradient outline with a transparent middle, so the game shows through */
    .frame {
      position: absolute;
      border-radius: 26px;
      box-shadow: 0 0 36px var(--glow);
    }
    .frame::before {
      content: "";
      position: absolute;
      inset: 0;
      padding: 5px;
      border-radius: inherit;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 50%, var(--primary-strong) 100%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
    }
    /* Hide the glow inside the window so it doesn't tint the game */
    .frame::after {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 21px;
      box-shadow: inset 0 0 18px var(--glow);
      opacity: 0.6;
    }
    .corner {
      position: absolute;
      width: 34px;
      height: 34px;
      background: var(--accent);
      clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
      filter: drop-shadow(0 0 8px var(--accent));
      animation: twinkle 3.4s ease-in-out infinite;
      z-index: 2;
    }

    #game { left: 40px; top: 40px; width: 1440px; height: 810px; }
    #chatbox { left: 1520px; top: 40px; width: 360px; height: 520px; }

    .tab {
      position: absolute;
      top: -22px;
      left: 36px;
      padding: 6px 20px;
      border-radius: 999px;
      font-family: "Fredoka", sans-serif;
      font-weight: 600;
      font-size: 22px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--panel-solid);
      background: linear-gradient(90deg, var(--primary), var(--accent));
      box-shadow: 0 4px 16px var(--glow);
      z-index: 3;
    }

    /* Bottom-left: name plate, stream title, rotating socials */
    .bar {
      position: absolute;
      left: 40px;
      top: 880px;
      width: 1440px;
      height: 160px;
      display: flex;
      align-items: stretch;
      gap: 24px;
    }
    .nameplate {
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 0 40px 0 30px;
    }
    .nameplate .moon {
      position: relative;
      width: 82px;
      height: 82px;
      flex: none;
    }
    .nameplate .who {
      display: flex;
      flex-direction: column;
    }
    .nameplate .live {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: "Fredoka", sans-serif;
      font-weight: 600;
      font-size: 20px;
      letter-spacing: 0.18em;
      color: var(--primary);
    }
    .nameplate .live::before {
      content: "";
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff5d8f;
      box-shadow: 0 0 10px #ff5d8f;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      50% { opacity: 0.35; }
    }
    .nameplate .name {
      font-size: 50px;
      line-height: 1.1;
      white-space: nowrap;
    }
    .info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
      padding: 0 36px;
      min-width: 0;
    }
    .info .title {
      font-size: 34px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rotator {
      position: relative;
      height: 50px;
      font-size: 24px;
    }
    .rotator .pill {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .rotator .pill.show {
      opacity: 1;
      transform: none;
    }

    /* Soft moonlit glow where the model stands (bottom-right) */
    .model-glow {
      position: absolute;
      right: -120px;
      bottom: -160px;
      width: 720px;
      height: 460px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, var(--glow) 0%, transparent 65%);
      opacity: 0.55;
      animation: breathe 6s ease-in-out infinite;
    }
    @keyframes breathe {
      50% { opacity: 0.3; transform: scale(0.94); }
    }
  </style>
</head>
<body class="transparent">
  <div class="model-glow"></div>

  <div class="frame" id="game">
    <span class="tab">now playing</span>
    <i class="corner" style="top:-17px; right:48px"></i>
    <i class="corner" style="bottom:-17px; left:-17px; animation-delay:-1.7s"></i>
  </div>

  <div class="frame" id="chatbox">
    <span class="tab">chat</span>
    <i class="corner" style="bottom:-17px; right:-17px; animation-delay:-0.8s"></i>
  </div>

  <div class="bar">
    <div class="panel starred nameplate">
      <div class="moon"></div>
      <div class="who">
        <span class="live">LIVE</span>
        <span class="name display" data-cfg="name"></span>
      </div>
    </div>
    <div class="panel info">
      <span class="title" data-cfg="streamTitle"></span>
      <div class="rotator" id="rotator"></div>
    </div>
  </div>

  <script src="../config.js"></script>
  <script src="../assets/core.js"></script>
  <script>
    const { cfg, still, bindText, renderSocials, onReady } = SD;
    onReady(() => {
      bindText();
      const rot = document.getElementById("rotator");
      renderSocials(rot);
      const pills = [...rot.children];
      if (!pills.length) return;
      let i = 0;
      pills[0].classList.add("show");
      if (still) return;
      setInterval(() => {
        pills[i].classList.remove("show");
        i = (i + 1) % pills.length;
        pills[i].classList.add("show");
      }, 6000);
    });
  </script>
</body>
</html>
