<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mockup — Pixel Arcade (Retro)</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="base.css">
  <style>
    :root { --bg: #0c0a24; --green: #3cff6b; --pink: #ff4fd8; --yellow: #ffe14d; --cyan: #4de1ff; --white: #f5f3ff; }
    body { font-family: "VT323", monospace; color: var(--white); image-rendering: pixelated; }
    .hero { background: linear-gradient(180deg, #0c0a24 0%, #1f1045 55%, #3b1560 100%); }
    .px { shape-rendering: crispEdges; }
    #sky { inset: 0; }
    .mountains { left: 0; bottom: 0; width: 1920px; height: 360px; }
    .crt { inset: 0; z-index: 9; background: repeating-linear-gradient(transparent 0 2px, rgba(0, 0, 0, 0.35) 2px 4px); }
    .curve { inset: 0; z-index: 10; box-shadow: inset 0 0 160px 40px rgba(0, 0, 0, 0.85); border-radius: 40px; }

    .hud { top: 36px; left: 60px; right: 60px; z-index: 6; display: flex; justify-content: space-between; font: 400 26px "Press Start 2P"; }
    .hud b { color: var(--pink); font-weight: 400; } .hud span:nth-child(2) b { color: var(--yellow); } .hud span:nth-child(3) b { color: var(--cyan); }
    .stage h1 { margin: 0; font: 400 104px/1.2 "Press Start 2P"; color: var(--yellow); text-shadow: 8px 8px 0 var(--pink), 16px 16px 0 #5a1a8a; }
    .stage .sub { margin: 30px 0 0; font: 400 46px "VT323"; color: var(--cyan); letter-spacing: 0.05em; }
    .box { margin-top: 40px; padding: 22px 50px; background: #000; border: 8px solid var(--white); box-shadow: 0 0 0 8px #000, 0 0 0 16px var(--pink); }
    .box small { display: block; font: 400 22px "Press Start 2P"; color: var(--green); margin-bottom: 14px; }
    .box span { font: 400 84px "Press Start 2P"; color: var(--white); }
    .coin { margin-top: 50px; font: 400 30px "Press Start 2P"; color: var(--white); animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .socials { margin-top: 38px; display: flex; gap: 30px; font: 400 36px "VT323"; }
    .socials i { font-style: normal; color: var(--green); margin-right: 8px; }
    .sprite { z-index: 6; }

    /* ---- component strip ---- */
    .strip { background: #07061a; }
    .strip .tag { color: var(--green); font-family: "Press Start 2P"; font-size: 12px; letter-spacing: 0.1em; }
    .m-alert { flex-direction: row; align-items: center; gap: 0; }
    .m-badge { width: 110px; height: 98px; margin-right: 24px; flex: none; }
    .m-card { min-width: 580px; padding: 28px 36px; background: #000; border: 8px solid var(--white); box-shadow: 0 0 0 8px #000, 0 0 0 14px var(--cyan); }
    .m-kind { font: 400 20px "Press Start 2P"; color: var(--green); }
    .m-kind::before { content: "▶ "; color: var(--yellow); }
    .m-who { margin-top: 18px; max-width: 520px; font: 400 30px/1.5 "Press Start 2P"; color: var(--yellow); }
    .m-plate { display: flex; align-items: center; gap: 26px; width: 100%; padding: 18px 26px; background: #000; border: 6px solid var(--pink); }
    .m-live { font: 400 22px "Press Start 2P"; color: #000; background: var(--green); padding: 8px 10px; }
    .m-name { font: 400 36px "Press Start 2P"; }
    .m-name::after { content: " ♥♥♥"; color: var(--pink); font-size: 26px; }
    .m-goal-top { font: 400 20px "Press Start 2P"; margin-bottom: 12px; }
    .m-goal-num { color: var(--yellow); }
    .m-track { height: 32px; background: #000; border: 6px solid var(--white); }
    .m-fill { background: repeating-linear-gradient(90deg, var(--green) 0 16px, #1fae45 16px 20px); }
    .m-msg { padding: 10px 16px; background: #000; border: 4px solid var(--white); font: 400 30px "VT323"; }
    .m-msg b { display: block; font: 400 15px "Press Start 2P"; color: var(--cyan); margin-bottom: 6px; }
  </style>
</head>
<body>
  <section class="hero">
    <div class="deco">
      <svg class="abs px" id="sky" viewBox="0 0 1920 1080"></svg>
      <svg class="abs px mountains" viewBox="0 0 1920 360" id="mtn"></svg>
      <svg class="abs px sprite" id="heart" style="left:250px; top:520px" width="112" height="98"></svg>
      <svg class="abs px sprite" id="coinspr" style="right:260px; top:480px" width="96" height="112"></svg>
      <div class="abs crt"></div>
      <div class="abs curve"></div>
      <div class="abs hud"><span><b>1UP</b> NOVA</span><span><b>HI-SCORE</b> 000742</span><span><b>CREDIT</b> 99</span></div>
    </div>
    <main class="stage">
      <h1>STARTING<br>SOON</h1>
      <p class="sub">loading level 1… grab your snacks, player</p>
      <div class="box"><small>TIME</small><span>04:59</span></div>
      <div class="coin">INSERT COIN</div>
      <div class="socials"><span><i>TWITCH</i>novamoonpetal</span><span><i>YT</i>@NovaMoonpetal</span><span><i>X</i>@nova_moonpetal</span></div>
    </main>
  </section>
  <section class="strip"></section>

  <script>
    let a = 3;
    const r = () => ((a = (a * 16807) % 2147483647) / 2147483647);
    // Square pixel stars
    let stars = "";
    const cols = ["#f5f3ff", "#4de1ff", "#ffe14d", "#ff4fd8"];
    for (let i = 0; i < 140; i++) { const s = r() < 0.15 ? 8 : 4; stars += `<rect x="${Math.round(r() * 240) * 8}" y="${Math.round(r() * 90) * 8}" width="${s}" height="${s}" fill="${cols[Math.floor(r() * 4)]}" opacity="${0.4 + r() * 0.6}"/>`; }
    document.getElementById("sky").innerHTML = stars;
    // Stepped pixel mountains, two layers
    function ridge(base, amp, color, step) {
      let h = base, out = "";
      for (let x = 0; x < 1920; x += step) { h = Math.max(40, Math.min(base + amp, h + (Math.round(r() * 2) - 1) * 24)); out += `<rect x="${x}" y="${360 - h}" width="${step}" height="${h}" fill="${color}"/>`; }
      return out;
    }
    document.getElementById("mtn").innerHTML = ridge(200, 120, "#46207e", 24) + ridge(110, 60, "#2a1152", 24) + `<rect x="0" y="330" width="1920" height="30" fill="#3cff6b"/><rect x="0" y="330" width="1920" height="6" fill="#b8ffca"/>`;
    // Sprites from text maps
    function rects(map, px, palette) {
      let out = "";
      map.trim().split("\n").forEach((row, y) => [...row.trim()].forEach((c, x) => { if (palette[c]) out += `<rect x="${x * px}" y="${y * px}" width="${px}" height="${px}" fill="${palette[c]}"/>`; }));
      return out;
    }
    function sprite(id, map, px, palette) {
      document.getElementById(id).innerHTML = rects(map, px, palette);
    }
    sprite("heart", `
      .kk...kk.
      krrk.kwwk
      krrrkrrwk
      krrrrrrrk
      .krrrrrk.
      ..krrrk..
      ...krk...
      ....k....`, 14, { k: "#000", r: "#ff4fd8", w: "#fff" });
    sprite("coinspr", `
      ..kkkk..
      .kyyyyk.
      kyywyyyk
      kyywyyok
      kyywyyok
      kyyyyyok
      .kyoook.
      ..kkkk..`, 14, { k: "#000", y: "#ffe14d", w: "#fff", o: "#d49a1f" });
    window.MOCK = {
      theme: "Pixel Arcade (Retro)",
      kind: "NEW FOLLOWER!",
      who: "A wild StarryMochi appeared!",
      badge: `<svg class="px" viewBox="0 0 126 112">${document.getElementById("heart").innerHTML}</svg>`,
      live: "LIVE",
      name: "NOVA",
      goalTitle: "EXP TO LV.2",
      chat: [["StarryMochi", "gg ez"], ["moonlit_kay", "press start to vibe"], ["pixelpudding", "HP full, let's go!"]],
    };
  </script>
  <script src="mock.js"></script>
</body>
</html>
