<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mockup — Game Day (Stadium)</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="base.css">
  <style>
    :root { --navy: #07122b; --blue: #1f6bff; --gold: #ffc93c; --red: #ff3b4e; --white: #f4f7ff; --pitch: #1f7a3a; }
    body { font-family: "Barlow Condensed", sans-serif; color: var(--white); }
    .hero { background: linear-gradient(180deg, #030817 0%, #0a1a3f 45%, #0d2250 60%); }

    /* Floodlights + beams */
    .tower { top: 40px; width: 150px; height: 70px; border-radius: 8px; background:
      radial-gradient(circle, #fff 0 9px, transparent 10px) 0 0 / 30px 23px, #1b2a4a; box-shadow: 0 0 80px 30px rgba(255, 255, 255, 0.35); z-index: 2; }
    .beam { top: 90px; width: 700px; height: 900px; transform-origin: 50% 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0) 80%);
      clip-path: polygon(45% 0, 55% 0, 100% 100%, 0 100%); mix-blend-mode: screen; }

    /* Crowd bowl */
    #crowd { left: 0; top: 330px; width: 1920px; height: 330px; }
    .stand-rail { left: 0; right: 0; top: 650px; height: 16px; background: linear-gradient(90deg, var(--red), var(--blue), var(--red)); box-shadow: 0 0 20px rgba(31, 107, 255, 0.7); }

    /* Pitch in perspective */
    .pitch { left: -20%; right: -20%; top: 666px; height: 800px; transform: perspective(700px) rotateX(55deg); transform-origin: 50% 0;
      background: repeating-linear-gradient(90deg, #1f7a3a 0 120px, #238643 120px 240px); }
    .pitch .lines { position: absolute; inset: 60px 18%; border: 6px solid rgba(255, 255, 255, 0.8); }
    .pitch .lines::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 6px solid rgba(255, 255, 255, 0.8); }
    .pitch .lines::after { content: ""; position: absolute; left: 50%; top: 50%; width: 260px; height: 260px; margin: -130px 0 0 -130px; border: 6px solid rgba(255, 255, 255, 0.8); border-radius: 50%; }

    /* Jumbotron */
    .board { position: relative; margin-top: -80px; width: 1180px; background: linear-gradient(180deg, #0e1c3d, #060d20); border: 6px solid #2a3b63; border-radius: 18px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), 0 0 60px rgba(31, 107, 255, 0.35); overflow: hidden; }
    .board .top { display: flex; justify-content: space-between; align-items: center; padding: 14px 28px; background: var(--blue); font: 800 28px "Barlow Condensed"; letter-spacing: 0.18em; }
    .board .top .dot { color: var(--red); margin-right: 8px; }
    .board h1 { margin: 18px 0 0; font: 400 220px/0.9 "Bebas Neue"; letter-spacing: 0.02em; background: linear-gradient(180deg, #fff 40%, #b9c9ff); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 0 var(--blue)); }
    .versus { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 30px; padding: 10px 50px 30px; }
    .team { font: 800 54px "Barlow Condensed"; letter-spacing: 0.06em; }
    .team small { display: block; font-size: 22px; letter-spacing: 0.3em; color: #9fb3e8; }
    .team.home { text-align: right; } .team.away { text-align: left; }
    .clock { padding: 6px 34px 10px; background: #000; border: 3px solid var(--gold); border-radius: 10px; }
    .clock small { display: block; font: 800 20px "Barlow Condensed"; letter-spacing: 0.35em; color: var(--gold); }
    .clock span { font: 400 110px/1 "Bebas Neue"; color: var(--gold); text-shadow: 0 0 20px rgba(255, 201, 60, 0.7); letter-spacing: 0.04em; }

    .ticker { left: 0; right: 0; bottom: 0; height: 70px; z-index: 6; display: flex; align-items: center; background: #050b1c; border-top: 4px solid var(--gold); overflow: hidden; white-space: nowrap; }
    .ticker .label { position: relative; z-index: 1; flex: none; height: 100%; display: grid; place-items: center; padding: 0 34px; background: var(--red); font: 800 30px "Barlow Condensed"; letter-spacing: 0.15em; }
    .ticker .run { font: 700 30px "Barlow Condensed"; letter-spacing: 0.08em; padding-left: 40px; animation: run 22s linear infinite; }
    .ticker .run b { color: var(--gold); margin: 0 10px 0 50px; }
    @keyframes run { to { transform: translateX(-50%); } }

    /* ---- component strip ---- */
    .strip { background: linear-gradient(180deg, #0a1733, #050b1c); }
    .strip .tag { color: var(--gold); }
    .m-alert { flex-direction: row; align-items: stretch; transform: skewX(-8deg); }
    .m-badge { width: 170px; padding: 38px; background: var(--gold); color: var(--navy); display: grid; place-items: center; }
    .m-card { padding: 22px 48px 26px 34px; background: linear-gradient(90deg, var(--blue), #123a9b); min-width: 520px; border-right: 12px solid var(--red); }
    .m-card > * { transform: skewX(8deg); }
    .m-kind { font: 800 28px "Barlow Condensed"; letter-spacing: 0.3em; color: var(--gold); }
    .m-who { font: 400 96px/0.95 "Bebas Neue"; letter-spacing: 0.03em; }
    .m-plate { display: flex; align-items: stretch; width: 100%; font-family: "Barlow Condensed"; }
    .m-live { display: grid; place-items: center; padding: 0 22px; background: var(--red); font: 800 26px "Barlow Condensed"; letter-spacing: 0.2em; }
    .m-name { flex: 1; padding: 8px 28px; background: #fff; color: var(--navy); font: 400 64px "Bebas Neue"; letter-spacing: 0.03em; }
    .m-goal-top { font: 800 28px "Barlow Condensed"; letter-spacing: 0.2em; margin-bottom: 8px; }
    .m-goal-num { font-family: "Bebas Neue"; font-size: 40px; color: var(--gold); letter-spacing: 0.05em; }
    .m-track { height: 26px; background: #0b1733; border: 2px solid #2a3b63; transform: skewX(-12deg); }
    .m-fill { background: linear-gradient(90deg, var(--blue), var(--gold)); }
    .m-msg { padding: 10px 18px; background: rgba(255, 255, 255, 0.06); border-left: 6px solid var(--blue); font: 600 26px "Barlow Condensed"; }
    .m-msg b { color: var(--gold); margin-right: 10px; letter-spacing: 0.05em; }
  </style>
</head>
<body>
  <section class="hero">
    <div class="deco">
      <canvas class="abs" id="crowd" width="1920" height="330"></canvas>
      <div class="abs stand-rail"></div>
      <div class="abs pitch"><div class="lines"></div></div>
      <div class="abs beam" style="left:-60px; transform: rotate(-24deg)"></div>
      <div class="abs beam" style="right:-60px; transform: rotate(24deg)"></div>
      <div class="abs tower" style="left:200px"></div>
      <div class="abs tower" style="right:200px"></div>
    </div>
    <main class="stage">
      <div class="board">
        <div class="top"><span><span class="dot">●</span>LIVE FROM THE ARENA</span><span>NOVA MOONPETAL</span></div>
        <h1>GAME DAY</h1>
        <div class="versus">
          <div class="team home"><small>HOME</small>NOVA</div>
          <div class="clock"><small>KICK-OFF IN</small><span>04:59</span></div>
          <div class="team away"><small>AWAY</small>CHAT</div>
        </div>
      </div>
    </main>
    <div class="abs ticker"><span class="label">FOLLOW</span><span class="run">
      <b>TWITCH</b>novamoonpetal <b>YOUTUBE</b>@NovaMoonpetal <b>X</b>@nova_moonpetal <b>TODAY</b>ranked grind: road to champion
      <b>TWITCH</b>novamoonpetal <b>YOUTUBE</b>@NovaMoonpetal <b>X</b>@nova_moonpetal <b>TODAY</b>ranked grind: road to champion</span></div>
  </section>
  <section class="strip"></section>

  <script>
    // Crowd: thousands of tiny colored dots with a few camera flashes
    (function () {
      const c = document.getElementById("crowd").getContext("2d");
      let a = 5;
      const r = () => ((a = (a * 16807) % 2147483647) / 2147483647);
      const g = c.createLinearGradient(0, 0, 0, 330);
      g.addColorStop(0, "#0a1636"); g.addColorStop(1, "#16285a");
      c.fillStyle = g; c.fillRect(0, 0, 1920, 330);
      const cols = ["#ff3b4e", "#1f6bff", "#ffc93c", "#f4f7ff", "#6a7fb5", "#8a4bff"];
      for (let y = 8; y < 330; y += 9) for (let x = (y % 18) / 2; x < 1920; x += 9) {
        c.globalAlpha = 0.25 + (y / 330) * 0.6; c.fillStyle = cols[Math.floor(r() * cols.length)];
        c.fillRect(x + r() * 2, y + r() * 2, 5, 5);
      }
      for (let i = 0; i < 40; i++) { c.globalAlpha = 1; c.fillStyle = "#fff"; c.shadowColor = "#fff"; c.shadowBlur = 14; c.beginPath(); c.arc(r() * 1920, r() * 320, 2.5, 0, 7); c.fill(); }
    })();
    window.MOCK = {
      theme: "Game Day (Stadium)",
      kind: "NEW FOLLOWER",
      who: "StarryMochi",
      badge: '<svg viewBox="0 0 64 64"><path fill="currentColor" d="M32 4 56 12v18c0 15-10 25-24 30C18 55 8 45 8 30V12z"/><path fill="#ffc93c" d="m32 18 4.5 9.5 10.5 1.3-7.7 7.2 2 10.5L32 41.3l-9.3 5.2 2-10.5-7.7-7.2 10.5-1.3z"/></svg>',
      live: "LIVE",
      goalTitle: "SEASON GOAL",
      chat: [["StarryMochi", "LET'S GOOO"], ["moonlit_kay", "clutch or kick"], ["pixelpudding", "MVP incoming 🏆"]],
    };
  </script>
  <script src="mock.js"></script>
</body>
</html>
